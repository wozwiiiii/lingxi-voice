name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    # 不起 postgres/redis 服务：tests/conftest.py 与 scripts/contract_check.py
    # 都硬编码 sqlite+aiosqlite:///:memory: 并用 fakeredis，外部服务是空转。
    # 若将来改为对真实 PG/Redis 跑测试，需在此补回 services 并同步 conftest。

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: sudo apt-get install -y ffmpeg
      - run: pip install -r backend/requirements-dev.txt
      - run: cd backend && ruff check .
      - run: cd backend && python -m pytest --cov=app --cov-report=term -x
        env:
          JWT_SECRET_KEY: test-ci-secret-key-not-for-production
      # 前端依赖的 API 契约门禁：改任何后端响应字段后必须跑通
      - run: cd backend && python scripts/contract_check.py
        env:
          JWT_SECRET_KEY: test-ci-secret-key-not-for-production

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: cd frontend && npm ci
      # build 内含 vue-tsc --noEmit，类型检查与打包一次完成
      - run: cd frontend && npm run build
