[alembic]
script_location = alembic
# 无论 cwd 在哪都能 import app.*（容器 exec 时 cwd=/，开发时 cwd=backend/）
prepend_sys_path = .
sqlalchemy.url = postgresql+asyncpg://lingxi:change-me-in-production@postgres:5432/lingxi

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
