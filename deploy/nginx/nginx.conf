# 灵犀语伴生产 nginx 配置
# 入口：托管前端静态产物 + 反代 API/媒体 + 安全响应头

server {
    listen 80;
    server_name localhost;
    client_max_body_size 20M;

    # ---- 安全响应头 ----
    # 防 MIME 嗅探
    add_header X-Content-Type-Options "nosniff" always;
    # 防 iframe 嵌入（点击劫持）
    add_header X-Frame-Options "SAMEORIGIN" always;
    # 防跨域读取（CORS 已在后端配置，这里不覆盖；Referrer 最小化）
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS：生产若启用 HTTPS 再放开；HTTP 下仅提示
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ---- 前端静态产物（SPA）----
    # dist 通过 compose 挂载到 /usr/share/nginx/html
    root /usr/share/nginx/html;
    index index.html;

    # 静态资源：带指纹的资产长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history 路由：未匹配的路径回退到 index.html（由前端路由处理 404）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 媒体文件：由 FastAPI StaticFiles 提供，nginx 缓存 ----
    location /media/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # ---- API 反代 ----
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 进度流需要关闭缓冲
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
