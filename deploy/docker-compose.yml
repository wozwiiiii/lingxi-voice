# 灵犀语伴 生产部署编排
# 端口暴露原则：仅前端 80 对外；8000 供本地调试 API/docs；Postgres/Redis 不暴露宿主机

services:
  # ---- 前端：构建 dist 并由 nginx 托管 ----
  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

  # ---- 后端 API ----
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*
    volumes:
      - ../backend:/app
      - media_data:/app/media
    ports:
      - "8000:8000"  # 本地调试 API/docs 用；生产可注释此行
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ---- 异步合成 worker ----
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    command: celery -A worker.celery_app worker --loglevel=info --concurrency=2
    volumes:
      - ../backend:/app
      - media_data:/app/media
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ---- PostgreSQL（不暴露宿主机）----
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  # ---- Redis（加密码鉴权，不暴露宿主机）----
  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "redis-server --requirepass \"$${REDIS_PASSWORD}\" --maxmemory-policy allkeys-lru --maxmemory 256mb"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  media_data:
