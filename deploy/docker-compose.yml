# 灵犀语伴 生产部署编排
# 端口暴露原则：仅前端 80 对外；API 只在容器网络内可达（调试用 exec）；
# Postgres/Redis 不暴露宿主机

services:
  # ---- 前端：构建 dist 并由 nginx 托管 ----
  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

  # ---- 后端 API ----
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*
    # P2-12：不再把宿主源码挂进容器（旧配置 ../backend:/app 会覆盖镜像内
    # COPY 的代码，"部署"实际等于开发态）；代码随镜像构建进入，改代码需
    # docker compose up -d --build 重建。media_data 卷持久化合成产物。
    volumes:
      - media_data:/app/media
    # 8000 不再映射宿主机（P2-12）：直连 uvicorn 可绕过 nginx 的
    # X-Forwarded-For 处理与限流语义。调试用：
    #   docker compose exec api curl localhost:8000/api/health
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ---- 异步合成 worker ----
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    command: celery -A worker.celery_app worker --loglevel=info --concurrency=2
    volumes:
      - media_data:/app/media
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ---- Celery Beat：定时任务（孤儿清理 + 音频清理 + 卡死收敛）----
  # 只跑一个实例（Beat 负责调度，不执行任务；执行由 worker 完成）。
  # 与 worker 共用同一镜像与 media_data 卷，音频清理才能访问到磁盘文件。
  beat:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    command: celery -A worker.celery_app beat --loglevel=info
    volumes:
      - media_data:/app/media
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ---- PostgreSQL（不暴露宿主机）----
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  # ---- Redis（加密码鉴权，不暴露宿主机）----
  # 淘汰策略用 volatile-lru：只淘汰带 TTL 的 key，且优先淘汰最久未用的。
  # 安全状态（JWT 黑名单/访客会话，db 1）体量极小且访问频繁，
  # 不会被缓存类大 key（tts:result 等）挤出；无 TTL 的熔断状态永不淘汰。
  # （旧配置 allkeys-lru 会在内存压力下逐出黑名单，导致已登出 token 复活）
  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "redis-server --requirepass \"$${REDIS_PASSWORD}\" --maxmemory-policy volatile-lru --maxmemory 256mb"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  media_data:
