services:
  inference:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.inference
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001
    volumes:
      - ../inference:/app
      - media_data:/app/media
    ports:
      - "8001:8001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    env_file:
      - .env
